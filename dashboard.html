<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADOS - Dashboard Simulador</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
  <style>
    :root {
      --ados-tinta: #0E1013;
      --ados-verde: #33D98B;
      --ados-verde-deep: #1C8D5B;
      --ados-hueso: #F2F4F1;
      --ados-text-secondary: #9BA1A6;
      --ados-border: #1E2227;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--ados-tinta);
      color: var(--ados-hueso);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* LOGIN SCREEN */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--ados-border);
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .login-box h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: var(--ados-verde);
    }

    .login-box p {
      color: var(--ados-text-secondary);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--ados-text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--ados-border);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--ados-hueso);
      font-size: 14px;
    }

    .form-group input::placeholder {
      color: var(--ados-text-secondary);
    }

    .login-button {
      width: 100%;
      padding: 12px;
      background: var(--ados-verde);
      color: var(--ados-tinta);
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }

    .login-button:hover {
      background: var(--ados-verde-deep);
    }

    /* DASHBOARD */
    .dashboard {
      display: none;
      padding: 20px;
    }

    .dashboard.active {
      display: block;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--ados-border);
    }

    .header h1 {
      font-size: 24px;
      color: var(--ados-verde);
    }

    .logout-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--ados-verde);
      color: var(--ados-verde);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .logout-btn:hover {
      background: rgba(51, 217, 139, 0.1);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--ados-border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }

    .stat-card .label {
      font-size: 12px;
      color: var(--ados-text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .stat-card .value {
      font-size: 32px;
      font-weight: 700;
      color: var(--ados-verde);
    }

    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters input, .filters button {
      padding: 8px 12px;
      border: 1px solid var(--ados-border);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--ados-hueso);
      font-size: 12px;
      cursor: pointer;
    }

    .table-container {
      overflow-x: auto;
      border: 1px solid var(--ados-border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead {
      background: rgba(51, 217, 139, 0.1);
      border-bottom: 1px solid var(--ados-border);
    }

    th {
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: var(--ados-verde);
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--ados-border);
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      background: rgba(51, 217, 139, 0.2);
      color: var(--ados-verde);
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--ados-text-secondary);
    }

    .error {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.5);
      color: #fca5a5;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div class="login-container" id="loginContainer">
    <div class="login-box">
      <h1>⚖ ADOS</h1>
      <p>Dashboard Simulador</p>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="passwordInput" placeholder="Ingresa contraseña">
      </div>
      <button class="login-button" onclick="checkPassword()">Acceder</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">
    <div class="header">
      <h1>📊 Usuarios Simulador</h1>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>

    <div id="error" class="error" style="display: none;"></div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Total usuarios</div>
        <div class="value" id="totalUsers">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Este mes</div>
        <div class="value" id="monthUsers">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Ahorro total</div>
        <div class="value" id="totalSavings">$0</div>
      </div>
    </div>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="Buscar nombre o email..." onkeyup="filterTable()">
      <input type="date" id="dateFilter" onchange="filterTable()">
      <button onclick="refreshData()">🔄 Actualizar</button>
    </div>

    <div class="table-container">
      <table id="usersTable">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Factoring</th>
            <th>Ahorro (CLP)</th>
            <th>Ahorro %</th>
            <th>Fecha</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="8" style="text-align: center; padding: 20px; color: var(--ados-text-secondary);">
              Cargando datos...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yvuwkmmwkvvwnouvomph.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl2dXdrbW13a3Z2d25vdXZvbXBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MDgzNDgsImV4cCI6MjEwNzQ4NDM0OH0.Yzd_J3ZcKl8yTiMxF32i_CZP_5pgPcZp67Mpb8ebHrg';
    const PASSWORD = 'ADOS2024';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allData = [];

    function checkPassword() {
      const password = document.getElementById('passwordInput').value;
      if (password === PASSWORD) {
        sessionStorage.setItem('adosAuth', 'true');
        showDashboard();
      } else {
        alert('❌ Contraseña incorrecta');
        document.getElementById('passwordInput').value = '';
      }
    }

    function showDashboard() {
      document.getElementById('loginContainer').style.display = 'none';
      document.getElementById('dashboard').classList.add('active');
      loadData();
    }

    function logout() {
      sessionStorage.removeItem('adosAuth');
      document.getElementById('loginContainer').style.display = 'flex';
      document.getElementById('dashboard').classList.remove('active');
      document.getElementById('passwordInput').value = '';
    }

    async function loadData() {
      try {
        const { data, error } = await supabase
          .from('simulador_clientes')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          showError('Error al cargar datos: ' + error.message);
          return;
        }

        allData = data || [];
        updateStats();
        renderTable(allData);
        enableRealtimeSubscription();
      } catch (e) {
        showError('Error: ' + e.message);
      }
    }

    function enableRealtimeSubscription() {
      const subscription = supabase
        .channel('simulador_clientes_changes')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'simulador_clientes' },
          (payload) => {
            console.log('✅ Nuevo evento en tiempo real:', payload);
            loadData(); // Recargar datos automáticamente
          }
        )
        .subscribe();
    }

    function updateStats() {
      // Total usuarios
      document.getElementById('totalUsers').textContent = allData.length;

      // Este mes
      const now = new Date();
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const monthUsers = allData.filter(u => new Date(u.created_at) >= monthStart).length;
      document.getElementById('monthUsers').textContent = monthUsers;

      // Ahorro total
      const totalSavings = allData.reduce((sum, u) => sum + (u.ahorro_anual_clp || 0), 0);
      document.getElementById('totalSavings').textContent = '$' + totalSavings.toLocaleString('es-CL').split('.')[0];
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 20px; color: var(--ados-text-secondary);">No hay datos</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(row => `
        <tr>
          <td>${row.nombre || '-'}</td>
          <td>${row.email || '-'}</td>
          <td>${row.telefono || '-'}</td>
          <td>${row.factoring || '-'}</td>
          <td>$${(row.ahorro_anual_clp || 0).toLocaleString('es-CL').split('.')[0]}</td>
          <td>${row.ahorro_porcentaje ? row.ahorro_porcentaje.toFixed(1) + '%' : '-'}</td>
          <td>${new Date(row.created_at).toLocaleDateString('es-CL')}</td>
          <td><span class="status-badge">✅ Completado</span></td>
        </tr>
      `).join('');
    }

    function filterTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const dateFilter = document.getElementById('dateFilter').value;

      let filtered = allData.filter(u => {
        const matchSearch = !search ||
          (u.nombre && u.nombre.toLowerCase().includes(search)) ||
          (u.email && u.email.toLowerCase().includes(search));

        const matchDate = !dateFilter ||
          new Date(u.created_at).toISOString().split('T')[0] === dateFilter;

        return matchSearch && matchDate;
      });

      renderTable(filtered);
    }

    function refreshData() {
      loadData();
    }

    function showError(msg) {
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 5000);
    }

    // Verificar si ya está autenticado
    window.addEventListener('load', () => {
      if (sessionStorage.getItem('adosAuth')) {
        showDashboard();
      }
    });
  </script>
</body>
</html>
